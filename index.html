<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Architectural portfolio — M.M. Vohra">
  <title>M.M. Vohra — Architectural Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/hero-01.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <a class="brand" href="#top" aria-label="Home">M.M. VOHRA</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="#work">Work</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-label="Portfolio introduction">
      <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
      <div class="hero-shade"></div>
      <div class="hero-caption">
        <span>Architecture / Design</span>
      </div>
      <a class="scroll-cue" href="#work" aria-label="Scroll to selected work">
        <span>Scroll</span><i></i>
      </a>
    </section>

    <section class="work" id="work">
      <div class="section-head">
        <p>Selected work</p>
        <span>01—02</span>
      </div>

      <figure class="project project-a">
        <img src="assets/hero-01.webp" alt="Architectural illustration" loading="lazy">
      </figure>

      <figure class="project project-b">
        <img src="assets/hero-02.webp" alt="Architectural illustration" loading="lazy">
      </figure>
    </section>

    <section class="about" id="about">
      <p class="eyebrow">About</p>
      <h1>Architecture, space and visual storytelling.</h1>
      <p class="about-copy">A minimal portfolio for selected architectural and design work.</p>
      <a class="back-top" href="#top">Back to top ↑</a>
    </section>
  </main>

  <script src="site.js"></script>
</body>
</html>
